{{- if .Values.ingress.enabled }}
apiVersion: {{ include "yapi.ingress.apiVersion" . }}
kind: Ingress
metadata:
  name: {{ include "yapi.fullname" . }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "yapi.labels" . | nindent 4 }}
    {{- with .Values.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if and .Values.ingress.ingressClassName (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.hostname | quote }}
      {{- if .Values.ingress.selfSigned }}
      secretName: {{ include "yapi.fullname" . }}-tls
      {{- end }}
    {{- with .Values.ingress.extraTls }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hostname | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path | default "/" }}
            {{- if .Values.ingress.pathType }}
            pathType: {{ .Values.ingress.pathType }}
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ include "yapi.fullname" . }}
                port:
                  name: {{ .Values.ingress.servicePort }}
              {{- else }}
              serviceName: {{ include "yapi.fullname" . }}
              servicePort: {{ .Values.ingress.servicePort }}
              {{- end }}
    {{- with .Values.ingress.extraHosts }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.ingress.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}

{{/* Helper function to get the correct apiVersion for Ingress */}}
{{- define "yapi.ingress.apiVersion" -}}
{{- if .Values.ingress.apiVersion -}}
{{- .Values.ingress.apiVersion -}}
{{- else if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
networking.k8s.io/v1beta1
{{- else -}}
extensions/v1beta1
{{- end }}
{{- end }} 