{{- if not .Values.mongodb.external.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "yapi.fullname" . }}-mongodb
  labels:
    app.kubernetes.io/name: mongodb
    helm.sh/chart: {{ include "yapi.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  serviceName: {{ include "yapi.fullname" . }}-mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.yapi.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            # 设置管理员账号
            - name: MONGODB_ROOT_USER
              value: "{{ .Values.mongodb.auth.rootUser }}"
            - name: MONGODB_ROOT_PASSWORD
              value: "{{ .Values.mongodb.auth.rootPassword }}"
            
            # 创建普通用户及默认数据库
            - name: MONGODB_USERNAME
              value: "{{ .Values.mongodb.auth.username }}"
            - name: MONGODB_PASSWORD
              value: "{{ .Values.mongodb.auth.password }}"
            - name: MONGODB_DATABASE
              value: "{{ .Values.mongodb.auth.database }}"
            
            # 开启调试模式
            - name: BITNAMI_DEBUG
              value: "true"
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          volumeMounts:
            - name: mongodb-data
              mountPath: /bitnami/mongodb
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if .Values.mongodb.persistence.storageClass }}
        storageClassName: "{{ .Values.mongodb.persistence.storageClass }}"
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mongodb.persistence.size }}
{{- end }}
