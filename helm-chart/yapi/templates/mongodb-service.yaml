{{- if not .Values.mongodb.external.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yapi.fullname" . }}-mongodb
  labels:
    app.kubernetes.io/name: mongodb
    helm.sh/chart: {{ include "yapi.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: mongodb
      protocol: TCP
      name: mongodb
  selector:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
